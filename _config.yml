title: Dora 的學習與工作筆記
author: Dora
description: 把學到的事記下來，把工作裡的問題想清楚。
lang: zh-TW
timezone: Asia/Taipei
theme: minima
url: "https://dorac7.github.io"
baseurl: "/dora-notes"
permalink: /notes/:year/:month/:day/:title/
show_excerpts: true
minima:
  date_format: "%Y-%m-%d"
plugins:
  - jekyll-feed
  - jekyll-seo-tag
header_pages:
  - archive.html
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
